[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kl-stadium-calendar"
version = "0.1.0"
description = "Aggregate upcoming Bukit Jalil National Stadium events and publish an iCalendar feed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "icalendar>=5.0.12",
  "python-dateutil>=2.9.0.post0",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[project.scripts]
kl-stadium-calendar = "kl_stadium_calendar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

